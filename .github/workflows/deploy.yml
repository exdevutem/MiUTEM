name: Despliegue de la aplicación
on:
  push:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      track:
        description: "Selecciona el track de despliegue"
        required: true
        default: "dev"
        type: choice
        options:
          - prod
          - dev
jobs:
  determine-environment:
    # Los bumps de dependabot no despliegan. Al saltarse este job, los deploy-* que dependen de él también se saltan.
    if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-environment.outputs.environment }}
    steps:
      - name: Determinar entorno de despliegue
        id: set-environment
        run: |
          if [[ "${{ inputs.track }}" == "production" || "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  deploy-android:
    needs: determine-environment
    # Por ahora vamos a limitar el despliegue de android a producción, ya que aún debemos crear la app de desarrollo para el track de desarrollo.
    # Si el commit inclue [skip deploy] o [skip android-deploy] en el mensaje, se saltará el despliegue.
    if: ${{ needs.determine-environment.outputs.environment == 'prod' && (!contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[skip android-deploy]')) }}
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    timeout-minutes: 60
    steps:
      - name: 📚 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚡ Configurar Cache para Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: ⚡ Configurar Cache para Flutter pub
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-cache-${{ runner.os }}-

      - name: ⚡ Configurar Cache para Dart global packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache/global_packages
          key: dart-global-${{ runner.os }}

      - name: 🐦 Configurar Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          cache: true
          channel: ${{ vars.FLUTTER_CHANNEL }}
          version: ${{ vars.FLUTTER_VERSION }}

      - name: 💎 Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ vars.RUBY_VERSION }}
          bundler-cache: true

      - name: 🗳️ Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: 📦 Instalar librerías
        run: flutter pub get

      - name: 🔥 Instalar FlutterFire
        run: dart pub global activate flutterfire_cli

      - name: 🪎 Configura bundle
        run: bundle install

      - name: 🔐 Configura credenciales de firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: ./scripts/flutterfire-configure ${{ needs.determine-environment.outputs.environment == 'prod' && 'prod' || 'dev' }} --build-type=Release

      - name: 🚀 Desplegar a Play Store
        run: bundle exec fastlane android deploy
        env:
          IS_CI: ${{ vars.IS_CI }}
          APP_PACKAGE_NAME: ${{ secrets.APP_PACKAGE_NAME }}
          APP_ENV: ${{ vars.APP_ENV }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          MIUTEM_KEYSTORE_BASE64: ${{ secrets.MIUTEM_KEYSTORE_BASE64 }}
          MIUTEM_KEYSTORE_PASSWORD: ${{ secrets.MIUTEM_KEYSTORE_PASSWORD }}
          MIUTEM_KEY_ALIAS: ${{ secrets.MIUTEM_KEY_ALIAS }}
          MIUTEM_KEY_PASSWORD: ${{ secrets.MIUTEM_KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
  deploy-ios:
    needs: determine-environment
    runs-on: macos-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    timeout-minutes: 60
    # Si contiene [skip deploy] o [skip ios-deploy] en el mensaje del commit, se saltará el despliegue.
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[skip ios-deploy]') }}
    steps:
      - name: 📚 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚒️ Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION }}

      - name: ⚡ Configurar Cache para Flutter pub
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: pub-cache-ios-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-cache-ios-${{ runner.os }}-

      - name: ⚡ Configurar Cache para Dart global packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache/global_packages
          key: dart-global-ios-${{ runner.os }}

      - name: ⚡ Configurar Cache para CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: pods-ios-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-ios-${{ runner.os }}-

      - name: ⚡ Configurar Cache para DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-ios-${{ runner.os }}-${{ hashFiles('ios/**/*.swift', 'ios/Podfile.lock') }}
          restore-keys: |
            derived-data-ios-${{ runner.os }}-

      - name: ⚡ Configurar Cache para Homebrew
        uses: actions/cache@v5
        with:
          path: |
            /opt/homebrew/Cellar/xcbeautify
          key: homebrew-macos-${{ runner.os }}-${{ hashFiles('.github/workflows/deploy.yml') }}
          restore-keys: homebrew-macos-${{ runner.os }}-

      - name: ⚡ Instalar Herramientas con Homebrew
        run: |
          brew install xcbeautify

      - name: 🐦 Configurar Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          cache: true
          channel: ${{ vars.FLUTTER_CHANNEL }}
          version: ${{ vars.FLUTTER_VERSION }}

      - name: 💎 Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ vars.RUBY_VERSION }}
          bundler-cache: true

      - name: 🗳️ Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: 📦 Instalar librerías
        run: flutter pub get

      - name: 🔥 Instalar FlutterFire
        run: dart pub global activate flutterfire_cli

      - name: 💍 Instala gem xcodeproj
        run: sudo gem install xcodeproj

      - name: 🪎 Configura bundle
        run: bundle install

      - name: 🔐 Configura credenciales de firebase (${{ needs.determine-environment.outputs.environment == 'prod' && 'Producción' || 'Desarrollo' }})
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: ./scripts/flutterfire-configure ${{ needs.determine-environment.outputs.environment == 'prod' && 'prod' || 'dev' }} --build-type=Release

      - name: 🚀 Desplegar a TestFlight (iOS)
        run: bundle exec fastlane ios deploy
        env:
          IS_CI: ${{ vars.IS_CI }}
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          APP_ENV: ${{ vars.APP_ENV }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          KEYCHAIN_NAME: ${{ secrets.KEYCHAIN_NAME }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MATCH_REPO: ${{ secrets.MATCH_REPO }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_TYPE: ${{ secrets.MATCH_TYPE }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

  # Las capturas van en un job aparte y no dentro de deploy-*: corre en paralelo con el
  # despliegue, no toca la firma del binario que sí se publica y, si falla, el release
  # ya salió igual. Además necesita otra configuración de firebase (Debug y los dos
  # entornos, porque `flutter drive` compila en debug y el test importa ambas opciones).
  #
  # Las dos plataformas van en el mismo job (y el mismo runner de macOS): el simulador de
  # iOS obliga a macOS, y ahí el emulador de Android también corre acelerado por hardware,
  # así que sale más barato que mantener dos jobs con la misma preparación duplicada.
  screenshots:
    needs: determine-environment
    runs-on: macos-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    timeout-minutes: 90
    # Si contiene [skip deploy] o [skip screenshots] en el mensaje del commit, se saltará.
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[skip screenshots]') }}
    env:
      # Los títulos de las capturas llevan tildes y el runner de macOS no define locale:
      # frameit se cae al leer los .strings y termina sin enmarcar ninguna captura.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: 📚 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚒️ Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION }}

      - name: ☕ Configurar Java
        # Gradle compila el APK de las capturas de Android; el JDK por defecto del runner
        # de macOS no siempre es el que espera el Android Gradle Plugin.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: ⚡ Configurar Cache para Flutter pub
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: pub-cache-screenshots-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-cache-screenshots-${{ runner.os }}-

      - name: ⚡ Configurar Cache para CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: pods-screenshots-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-screenshots-${{ runner.os }}-

      - name: ⚡ Configurar Cache para Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-screenshots-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-screenshots-${{ runner.os }}-

      - name: 🪄 Instalar ImageMagick
        # frameit y los scripts de fondos y composición trabajan con `magick`.
        run: brew install imagemagick

      - name: 🐦 Configurar Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          cache: true
          channel: ${{ vars.FLUTTER_CHANNEL }}
          version: ${{ vars.FLUTTER_VERSION }}

      - name: 💎 Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ vars.RUBY_VERSION }}
          bundler-cache: true

      - name: 🗳️ Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: 📦 Instalar librerías
        run: flutter pub get

      - name: 🔥 Instalar FlutterFire
        run: dart pub global activate flutterfire_cli

      # flutterfire configure invoca `ruby -e "require 'xcodeproj'"` fuera de bundler, así
      # que la gem tiene que estar instalada global (igual que en deploy-ios y deploy-macos).
      - name: 💍 Instala gem xcodeproj
        run: sudo gem install xcodeproj

      - name: 🪎 Configura bundle
        run: bundle install

      - name: 🔐 Configura credenciales de firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        # `all` y Debug: `flutter drive` compila en debug y integration_test/screenshots_test.dart
        # importa las opciones de firebase de los dos entornos.
        run: ./scripts/flutterfire-configure all --build-type=Debug

      - name: 📸 Generar capturas de iOS (iPhone y iPad)
        run: bundle exec fastlane ios screenshots
        env:
          APP_ENV: ${{ vars.APP_ENV }}

      - name: 📸 Generar capturas de Android
        # El lane reutiliza el emulador que deja levantado la acción en vez de arrancar uno.
        # En los runners de macOS (Apple Silicon) la imagen del sistema tiene que ser arm64.
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          APP_PACKAGE_NAME: ${{ secrets.APP_PACKAGE_NAME }}
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bundle exec fastlane android screenshots

      - name: 📤 Subir capturas como artefacto
        id: artefacto
        uses: actions/upload-artifact@v7
        with:
          name: capturas
          path: |
            fastlane/screenshots/*/*.png
            android/fastlane/screenshots/*/*.png
          if-no-files-found: error

      - name: 📝 Publicar capturas en el resumen
        env:
          ARTEFACTO_URL: ${{ steps.artefacto.outputs.artifact-url }}
        run: |
          {
            echo "## 📸 Capturas de pantalla"
            echo ""
            echo "- $(find fastlane/screenshots -name '*_framed.png' | wc -l | tr -d ' ') capturas enmarcadas para la App Store"
            echo "- $(find android/fastlane/screenshots -name '*_framed.png' | wc -l | tr -d ' ') capturas enmarcadas para Google Play"
            echo "- [Descargar artefacto]($ARTEFACTO_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-macos:
    needs: determine-environment
    runs-on: macos-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    timeout-minutes: 60
    # Si contiene [skip deploy] o [skip macos-deploy] en el mensaje del commit, se saltará el despliegue.
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[skip macos-deploy]') }}
    steps:
      - name: 📚 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚒️ Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION }}

      - name: ⚡ Configurar Cache para Flutter pub
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: pub-cache-macos-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-cache-macos-${{ runner.os }}-

      - name: ⚡ Configurar Cache para Dart global packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache/global_packages
          key: dart-global-macos-${{ runner.os }}

      - name: ⚡ Configurar Cache para CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: pods-macos-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-macos-${{ runner.os }}-

      - name: ⚡ Configurar Cache para DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-macos-${{ runner.os }}-${{ hashFiles('ios/**/*.swift', 'ios/Podfile.lock') }}
          restore-keys: |
            derived-data-macos-${{ runner.os }}-

      - name: ⚡ Configurar Cache para Homebrew
        uses: actions/cache@v5
        with:
          path: |
            /opt/homebrew/Cellar/xcbeautify
          key: homebrew-macos-${{ runner.os }}-${{ hashFiles('.github/workflows/deploy.yml') }}
          restore-keys: homebrew-macos-${{ runner.os }}-

      - name: ⚡ Instalar Herramientas con Homebrew
        run: |
          brew install xcbeautify

      - name: 🐦 Configurar Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          cache: true
          channel: ${{ vars.FLUTTER_CHANNEL }}
          version: ${{ vars.FLUTTER_VERSION }}

      - name: 💎 Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ vars.RUBY_VERSION }}
          bundler-cache: true

      - name: 🗳️ Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: 📦 Instalar librerías
        run: flutter pub get

      - name: 🔥 Instalar FlutterFire
        run: dart pub global activate flutterfire_cli

      - name: 💍 Instala gem xcodeproj
        run: sudo gem install xcodeproj

      - name: 🪎 Configura bundle
        run: bundle install

      - name: 🔐 Configura credenciales de firebase (${{ needs.determine-environment.outputs.environment == 'prod' && 'Producción' || 'Desarrollo' }})
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: ./scripts/flutterfire-configure ${{ needs.determine-environment.outputs.environment == 'prod' && 'prod' || 'dev' }} --build-type=Release

      - name: 🚀 Desplegar a TestFlight (macOS)
        run: bundle exec fastlane mac deploy
        env:
          IS_CI: ${{ vars.IS_CI }}
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          APP_ENV: ${{ vars.APP_ENV }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          KEYCHAIN_NAME: ${{ secrets.KEYCHAIN_NAME }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MATCH_REPO: ${{ secrets.MATCH_REPO }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_TYPE: ${{ secrets.MATCH_TYPE }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
