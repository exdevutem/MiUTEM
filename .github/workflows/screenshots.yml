# Las capturas viven en su propio workflow y no dentro del despliegue: corren en paralelo
# con él, no tocan la firma del binario que sí se publica y, si fallan, el release ya salió
# igual. Además necesitan otra configuración de firebase (Debug, porque las capturas salen
# de una compilación de debug).
#
# Cada plataforma va en su propio runner: el simulador de iOS y la app de macOS obligan a un
# runner de macOS, y el emulador de Android necesita virtualización anidada. Los runners de
# macOS son máquinas virtuales sobre Apple Silicon y ahí adentro Hypervisor.framework no
# está disponible, así que el emulador —da igual si la imagen es arm64— muere apenas
# arranca con "HVF error: HV_UNSUPPORTED" y la acción se queda esperando un boot que nunca
# llega. En Linux sí hay KVM, y de paso los recorridos corren en paralelo.
#
# El recorrido de cada plataforma sale de su propia herramienta de fastlane: snapshot (UI
# Tests de Xcode) en iOS y iPad, screengrab (tests instrumentados) en Android y
# `flutter drive` en macOS, que es la única que ninguna de las dos cubre.
name: Capturas de pantalla
on:
  push:
    branches: [dev, prod]
  # Al abrir la PR y al sacarla de borrador, para ver en la propia PR cómo queda la app.
  # `synchronize` no está a propósito: cada corrida se lleva runners de macOS por casi una
  # hora y no vale la pena repetirla en cada push a la rama. Para volver a generarlas está
  # el comentario de abajo.
  pull_request:
    types: [opened, ready_for_review]
    branches: [dev, prod]
  # Comentando en la PR "@miutem screenshot <ios|macos|android|all>" (sin argumento, all).
  # El filtro va en el `if` de determine-environment, porque acá el evento llega por
  # cualquier comentario del repositorio.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      track:
        description: "Selecciona el track del que se toman las capturas"
        required: true
        default: "dev"
        type: choice
        options:
          - prod
          - dev
jobs:
  determine-environment:
    # Los bumps de dependabot no generan capturas. Al saltarse este job, los screenshots-*
    # que dependen de él también se saltan.
    #
    # De los comentarios sólo pasan los que piden capturas en una PR, y sólo si quien
    # comenta tiene permiso de escritura: un comentario corre con los secretos del repo y
    # sobre el código de la rama de la PR, así que no puede quedar abierto a cualquiera.
    if: >-
      ${{ github.actor != 'dependabot[bot]'
      && github.event.head_commit.author.username != 'dependabot[bot]'
      && (github.event_name != 'issue_comment'
          || (github.event.issue.pull_request
              && contains(github.event.comment.body, '@miutem screenshot')
              && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))) }}
    runs-on: ubuntu-latest
    permissions:
      # Para dejar la reacción con la que se acusa recibo del comando.
      issues: write
    outputs:
      environment: ${{ steps.set-environment.outputs.environment }}
      plataformas: ${{ steps.set-environment.outputs.plataformas }}
    steps:
      - name: Determinar entorno y plataformas
        id: set-environment
        env:
          # Por variable de entorno y no interpolado en el script: el cuerpo del comentario
          # lo escribe quien sea y dentro del `run` sería una inyección de shell.
          COMENTARIO: ${{ github.event.comment.body }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [[ "${{ inputs.track }}" == "production" || "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

          # Se capturan todas las plataformas salvo que el comando pida una sola.
          plataformas=all
          if [[ "$EVENTO" == "issue_comment" ]]; then
            if [[ "$COMENTARIO" =~ @miutem[[:space:]]+screenshot([[:space:]]+(ios|macos|android|all))? ]]; then
              plataformas="${BASH_REMATCH[2]:-all}"
            fi
          fi

          echo "Plataformas a capturar: $plataformas"
          echo "plataformas=$plataformas" >> $GITHUB_OUTPUT

      - name: 👀 Acusar recibo del comando
        # El run de un comentario no aparece entre los checks de la PR, así que sin esto
        # quien lo pide se queda sin saber si se tomó hasta que llega el comentario final.
        if: ${{ github.event_name == 'issue_comment' }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -d '{"content":"eyes"}' > /dev/null

  screenshots-ios:
    needs: determine-environment
    runs-on: macos-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    # Un runner por dispositivo: hechos uno tras otro el job se iba a hora y media, y son dos
    # recorridos independientes. fail-fast apagado para que un simulador que falle no cancele
    # el otro, que igual sirve para la ficha.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Los mismos dos que trae por defecto el lane, uno en cada runner. Por qué esos
          # modelos y no otros está explicado ahí.
          - dispositivo: iPhone 17 Pro Max
            artefacto: iphone
          - dispositivo: iPad Air 13-inch
            artefacto: ipad
    # Un recorrido se lleva ~25 minutos, más la compilación y la preparación del runner.
    timeout-minutes: 60
    # Si contiene [skip deploy] o [skip screenshots] en el mensaje del commit, se saltará.
    # `plataformas` sale del comando del comentario; en el resto de los eventos es `all`.
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip deploy]')
      && !contains(github.event.head_commit.message, '[skip screenshots]')
      && contains(fromJSON('["all", "ios"]'), needs.determine-environment.outputs.plataformas) }}
    env:
      # Los títulos de las capturas llevan tildes y el runner de macOS no define locale:
      # frameit se cae al leer los .strings y termina sin enmarcar ninguna captura.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: 📚 Clonar Repositorio
        uses: actions/checkout@v4
        with:
          # El run de un comentario sale de la rama por defecto: hay que traer el código de
          # la PR a la que se le pidieron las capturas. En el resto de los eventos, vacío
          # deja el checkout como viene.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: ⚒️ Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION }}

      - name: ⚡ Configurar Cache para Flutter pub
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: pub-cache-screenshots-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-cache-screenshots-${{ runner.os }}-

      - name: ⚡ Configurar Cache para CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: pods-screenshots-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-screenshots-${{ runner.os }}-

      - name: 🪄 Instalar ImageMagick
        # frameit y los scripts de fondos y composición trabajan con `magick`.
        run: brew install imagemagick

      - name: 🐦 Configurar Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          cache: true
          channel: ${{ vars.FLUTTER_CHANNEL }}
          version: ${{ vars.FLUTTER_VERSION }}

      - name: 💎 Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ vars.RUBY_VERSION }}
          bundler-cache: true

      - name: 🗳️ Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: 📦 Instalar librerías
        run: flutter pub get

      - name: 🔥 Instalar FlutterFire
        run: dart pub global activate flutterfire_cli

      # flutterfire configure invoca `ruby -e "require 'xcodeproj'"` fuera de bundler, así
      # que la gem tiene que estar instalada global (igual que en deploy-ios y deploy-macos).
      - name: 💍 Instala gem xcodeproj
        run: sudo gem install xcodeproj

      - name: 🪎 Configura bundle
        run: bundle install

      - name: 🔐 Configura credenciales de firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        # Debug porque las capturas salen de una compilación de debug, y `all` porque el
        # lane elige el flavor según APP_ENV: los dos tienen que tener sus credenciales.
        run: ./scripts/flutterfire-configure all --build-type=Debug

      - name: 📸 Generar capturas de iOS
        run: bundle exec fastlane ios screenshots
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          SCREENSHOT_DEVICES: ${{ matrix.dispositivo }}

      - name: 📤 Subir capturas como artefacto
        id: artefacto
        uses: actions/upload-artifact@v7
        with:
          name: capturas-${{ matrix.artefacto }}
          path: fastlane/screenshots/*/*.png
          if-no-files-found: error

      - name: 📝 Publicar capturas en el resumen
        env:
          ARTEFACTO_URL: ${{ steps.artefacto.outputs.artifact-url }}
          DISPOSITIVO: ${{ matrix.dispositivo }}
        run: |
          {
            echo "## 📸 Capturas de pantalla ($DISPOSITIVO)"
            echo ""
            echo "- $(find fastlane/screenshots -name '*_framed.png' | wc -l | tr -d ' ') capturas enmarcadas para la App Store"
            echo "- [Descargar artefacto]($ARTEFACTO_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  screenshots-android:
    needs: determine-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    timeout-minutes: 60
    # Si contiene [skip deploy] o [skip screenshots] en el mensaje del commit, se saltará.
    # `plataformas` sale del comando del comentario; en el resto de los eventos es `all`.
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip deploy]')
      && !contains(github.event.head_commit.message, '[skip screenshots]')
      && contains(fromJSON('["all", "android"]'), needs.determine-environment.outputs.plataformas) }}
    env:
      # Los títulos llevan tildes y frameit los lee con el encoding del entorno: si no es
      # UTF-8 no falla, simplemente deja las capturas sin enmarcar. C.UTF-8 siempre existe
      # en Ubuntu, a diferencia de en_US.UTF-8, que hay que generar.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: 📚 Clonar Repositorio
        uses: actions/checkout@v4
        with:
          # El run de un comentario sale de la rama por defecto: hay que traer el código de
          # la PR a la que se le pidieron las capturas. En el resto de los eventos, vacío
          # deja el checkout como viene.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: 🖥️ Habilitar KVM
        # Sin esto el emulador arranca por software y el recorrido no alcanza a terminar.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ☕ Configurar Java
        # Gradle compila el APK de las capturas; se fija el JDK en vez de depender del que
        # traiga por defecto la imagen del runner, que cambia entre versiones.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: ⚡ Configurar Cache para Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-screenshots-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-screenshots-${{ runner.os }}-

      - name: ⚡ Configurar Cache para Flutter pub
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: pub-cache-screenshots-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-cache-screenshots-${{ runner.os }}-

      - name: 🪄 Instalar ImageMagick
        # frameit y los scripts de fondos y composición trabajan con `magick`, que sólo
        # existe en ImageMagick 7: el paquete de apt sigue en el 6 y deja únicamente
        # `convert`. El runner ya trae Homebrew (instalado pero fuera del PATH) y su
        # fórmula sí es la 7, así que se instala igual que en macOS y se enlazan sólo los
        # binarios, para no meter todo el prefijo de brew delante del PATH del resto del job.
        #
        # `convert` va aunque nadie lo llame: es el binario de ImageMagick 6 y frameit lo
        # sigue buscando para decidir si tiene con qué trabajar, así que sin él el
        # `fastlane frameit` de scripts/compose-store-screenshots se niega a partir.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install imagemagick
          for binario in magick convert; do
            sudo ln -sf "$HOMEBREW_PREFIX/bin/$binario" "/usr/local/bin/$binario"
          done
          # Por la ruta enlazada, que es la que ven los pasos siguientes (sin el PATH de brew).
          /usr/local/bin/magick -version
          /usr/local/bin/convert -version

      - name: 🐦 Configurar Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          cache: true
          channel: ${{ vars.FLUTTER_CHANNEL }}
          version: ${{ vars.FLUTTER_VERSION }}

      - name: 💎 Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ vars.RUBY_VERSION }}
          bundler-cache: true

      - name: 🗳️ Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: 📦 Instalar librerías
        run: flutter pub get

      - name: 🔥 Instalar FlutterFire
        run: dart pub global activate flutterfire_cli

      - name: 🪎 Configura bundle
        run: bundle install

      - name: 🔐 Configura credenciales de firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        # Debug porque las capturas salen de una compilación de debug, y `all` porque el
        # lane elige el flavor según APP_ENV: los dos tienen que tener sus credenciales.
        run: ./scripts/flutterfire-configure all --build-type=Debug

      - name: 📸 Generar capturas de Android
        # El lane reutiliza el emulador que deja levantado la acción en vez de arrancar uno.
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          APP_PACKAGE_NAME: ${{ secrets.APP_PACKAGE_NAME }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bundle exec fastlane android screenshots

      - name: 📤 Subir capturas como artefacto
        id: artefacto
        uses: actions/upload-artifact@v7
        with:
          name: capturas-android
          path: android/fastlane/screenshots/*/*.png
          if-no-files-found: error

      - name: 📝 Publicar capturas en el resumen
        env:
          ARTEFACTO_URL: ${{ steps.artefacto.outputs.artifact-url }}
        run: |
          {
            echo "## 📸 Capturas de pantalla (Android)"
            echo ""
            echo "- $(find android/fastlane/screenshots -name '*_framed.png' | wc -l | tr -d ' ') capturas enmarcadas para Google Play"
            echo "- [Descargar artefacto]($ARTEFACTO_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  screenshots-macos:
    needs: determine-environment
    runs-on: macos-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    timeout-minutes: 60
    # Si contiene [skip deploy] o [skip screenshots] en el mensaje del commit, se saltará.
    # `plataformas` sale del comando del comentario; en el resto de los eventos es `all`.
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip deploy]')
      && !contains(github.event.head_commit.message, '[skip screenshots]')
      && contains(fromJSON('["all", "macos"]'), needs.determine-environment.outputs.plataformas) }}
    env:
      # Los títulos de las capturas llevan tildes y el runner de macOS no define locale.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: 📚 Clonar Repositorio
        uses: actions/checkout@v4
        with:
          # El run de un comentario sale de la rama por defecto: hay que traer el código de
          # la PR a la que se le pidieron las capturas. En el resto de los eventos, vacío
          # deja el checkout como viene.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: ⚒️ Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION }}

      - name: ⚡ Configurar Cache para Flutter pub
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: pub-cache-screenshots-macos-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-cache-screenshots-macos-${{ runner.os }}-

      - name: ⚡ Configurar Cache para CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            macos/Pods
            ~/.cocoapods
          key: pods-screenshots-macos-${{ runner.os }}-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: pods-screenshots-macos-${{ runner.os }}-

      - name: 🪄 Instalar ImageMagick
        # Los scripts de fondos y de enmarcado trabajan con `magick`.
        run: brew install imagemagick

      - name: 🐦 Configurar Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          cache: true
          channel: ${{ vars.FLUTTER_CHANNEL }}
          version: ${{ vars.FLUTTER_VERSION }}

      - name: 💎 Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ vars.RUBY_VERSION }}
          bundler-cache: true

      - name: 🗳️ Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: 📦 Instalar librerías
        run: flutter pub get

      - name: 🔥 Instalar FlutterFire
        run: dart pub global activate flutterfire_cli

      # flutterfire configure invoca `ruby -e "require 'xcodeproj'"` fuera de bundler, así
      # que la gem tiene que estar instalada global (igual que en deploy-ios y deploy-macos).
      - name: 💍 Instala gem xcodeproj
        run: sudo gem install xcodeproj

      - name: 🪎 Configura bundle
        run: bundle install

      - name: 🔐 Configura credenciales de firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        # `all` y Debug: el recorrido de macOS lo ejecuta `flutter drive`, que compila en
        # debug, e integration_test/screenshots_test.dart importa las opciones de firebase
        # de los dos entornos.
        run: ./scripts/flutterfire-configure all --build-type=Debug

      - name: 📸 Generar capturas de macOS
        run: bundle exec fastlane mac screenshots
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          IS_CI: ${{ vars.IS_CI }}

      - name: 📤 Subir capturas como artefacto
        id: artefacto
        uses: actions/upload-artifact@v7
        with:
          name: capturas-macos
          path: macos/fastlane/screenshots/*/*.png
          if-no-files-found: error

      - name: 📝 Publicar capturas en el resumen
        env:
          ARTEFACTO_URL: ${{ steps.artefacto.outputs.artifact-url }}
        run: |
          {
            echo "## 📸 Capturas de pantalla (macOS)"
            echo ""
            echo "- $(find macos/fastlane/screenshots -name '*_framed.png' | wc -l | tr -d ' ') capturas enmarcadas de 2880x1800 para la Mac App Store"
            echo "- [Descargar artefacto]($ARTEFACTO_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deja en la PR el detalle de lo que salió en cada plataforma. Las imágenes no se pueden
  # mostrar embebidas —GitHub no deja adjuntar archivos a un comentario desde la API—, así
  # que el comentario lleva la lista de capturas y el enlace para descargar el artefacto.
  #
  # Va en un job aparte y no dentro de cada plataforma para dejar un solo comentario por
  # corrida, en vez de cuatro compitiendo por el mismo hilo.
  comentario-en-pr:
    needs: [screenshots-ios, screenshots-android, screenshots-macos]
    runs-on: ubuntu-latest
    # `always()` para comentar también cuando una plataforma falla: saber cuál se cayó es
    # parte de lo que se revisa en la PR. En PRs desde un fork no corre, porque ahí el
    # token es de sólo lectura y tampoco hay secretos con los que generar las capturas; en
    # los comentarios el token sí puede escribir, y quién puede pedirlas ya lo filtró
    # determine-environment.
    if: >-
      ${{ always()
      && (github.event_name == 'issue_comment'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: 📚 Clonar Repositorio
        uses: actions/checkout@v4
        with:
          # El run de un comentario sale de la rama por defecto: hay que traer el código de
          # la PR a la que se le pidieron las capturas. En el resto de los eventos, vacío
          # deja el checkout como viene.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: 📥 Descargar las capturas
        uses: actions/download-artifact@v7
        # Si todas las plataformas fallaron no hay artefactos, y el comentario igual tiene
        # que salir para contar que no se generó ninguna captura.
        continue-on-error: true
        with:
          pattern: capturas-*
          path: capturas

      - name: 💬 Comentar en la PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # En un comentario la PR llega como issue: son el mismo número.
          PR_NUMERO: ${{ github.event.pull_request.number || github.event.issue.number }}
          RESULTADO_IOS: ${{ needs.screenshots-ios.result }}
          RESULTADO_ANDROID: ${{ needs.screenshots-android.result }}
          RESULTADO_MACOS: ${{ needs.screenshots-macos.result }}
        run: ./scripts/pr-screenshots-comment capturas
