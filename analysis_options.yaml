include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 512
  trailing_commas: preserve

analyzer:
  exclude:
    - lib/firebase_options_*.dart
    - lib/main_dev.dart
    - lib/main_prod.dart
    # Importa las opciones de firebase de los dos entornos, que las genera
    # `scripts/flutterfire-configure` y no están versionadas.
    - integration_test/screenshots_test.dart
    - fastlane/build/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Reglas habilitadas
    - sized_box_for_whitespace
    - avoid_empty_else
    - always_declare_return_types
    - prefer_double_quotes
    - prefer_const_constructors
    # Reglas deshabilitadas
    - prefer_single_quotes: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
